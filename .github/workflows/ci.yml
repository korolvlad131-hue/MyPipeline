name: MyPipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: dist/
          
      - name: Generate Docker image tag
        id: tag
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.KOROLVLAD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/nodeapp:$IMAGE_TAG \
            -t ${{ secrets.DOCKER_USERNAME }}/nodeapp:$BRANCH_TAG \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nodeapp:$IMAGE_TAG
          docker push ${{ secrets.DOCKER_USERNAME }}/nodeapp:$BRANCH_TAG

      - name: Prepare SSH key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | BASE64 --decode > ~/.shh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Verify SSH host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Docker container to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "set -e
             sudo docker pull $DOCKER_USERNAME/nodeapp:$IMAGE_TAG
             sudo docker rm -f nodeapp || true
             sudo docker run -d \
               --restart unless-stopped \
               --name nodeapp \
               -p 3000:3000 \
               $DOCKER_USERNAME/nodeapp:$IMAGE_TAG"
      



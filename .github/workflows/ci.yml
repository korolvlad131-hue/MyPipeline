name: MyPipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: dist/

      - name: Generate Docker image tag
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.KOROLVLAD }}

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKER_USERNAME }}/nodeapp:$IMAGE_TAG" \
            -t "${{ secrets.DOCKER_USERNAME }}/nodeapp:$BRANCH_TAG" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/nodeapp:$IMAGE_TAG"
          docker push "${{ secrets.DOCKER_USERNAME }}/nodeapp:$BRANCH_TAG"

      - name: Prepare SSH key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s' "$SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

      - name: Verify SSH host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy Docker Compose to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          scp -i "$HOME/.ssh/ec2_key" \
            docker-compose.yml \
            "$EC2_USER@$EC2_HOST:~/nodeapp/docker-compose.yml"

          ssh -i "$HOME/.ssh/ec2_key" "$EC2_USER@$EC2_HOST" \
            "set -e
             cd ~/nodeapp
             sudo docker rm -f nodeapp 2>/dev/null || true
             IMAGE_TAG=$IMAGE_TAG sudo -E docker compose pull
             IMAGE_TAG=$IMAGE_TAG sudo -E docker compose up -d --remove-orphans
             sudo docker compose ps"
      



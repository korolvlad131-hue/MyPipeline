services:
  app:
    image: korolvlad/nodeapp:${IMAGE_TAG:-main}
    container_name: nodeapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: nodeuser
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: nodedb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: nodeapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodeuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: nodedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodeuser -d nodedb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
